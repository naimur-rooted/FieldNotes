services:
  - type: web
    name: fieldnotes-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JDBC_DATABASE_URL
        sync: false # paste Render Postgres External URL converted to jdbc:postgresql://...?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://fieldnotes-app.vercel.app
      - key: DDL_AUTO
        value: update
