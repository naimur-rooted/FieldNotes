spring.application.name=fieldnotes-api
server.port=${PORT:8080}

# ---- Local default: MySQL (XAMPP) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fieldnotes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ---- Render: set JDBC_DATABASE_URL to the Render Postgres "External Database URL"
# e.g. jdbc:postgresql://user:pass@host:5432/dbname?sslmode=require
# When JDBC_DATABASE_URL is present it overrides the three lines above.
spring.config.import=optional:classpath:render.properties

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# JWT - MUST be overridden in production via JWT_SECRET env var
app.jwt.secret=${JWT_SECRET:CHANGE_ME_fieldnotes_super_secret_key_at_least_32_chars_long_12345}
app.jwt.expiration-ms=86400000

# CORS - comma-separated origins of the Vercel frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Email SMTP Configuration (Optional: fallback mode active if username/password not provided)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



